<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>farmOS Map</title>
    <link rel="stylesheet" href="./farmOS-map.css" type="text/css">
    <style>
      html, body {
        margin: 0;
        height: 100%;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="./farmOS-map.js"></script>
    <script>
      var options = {
        units: 'metric',
      }
      var myMap = farmOS.map.create("map", options);
      myMap.addBehavior("edit").then(() => {
        myMap.addBehavior("measure", { layer: myMap.edit.layer });
        myMap.edit.wktOn("featurechange", console.log);
        myMap.edit.geoJSONOn("featurechange", console.log);
      });
      myMap.addBehavior("sidePanel");
      myMap.addBehavior("layerSwitcherInSidePanel");
      myMap.addBehavior("snappingGrid");

      (function () {
        myMap.attachBehavior({
          attach: function (instance) {

            // Adding a WMS layer.
            const wmsOpts = {
              title: 'soil-survey', // defaults to 'wms'
              url: 'https://sdmdataaccess.nrcs.usda.gov/Spatial/SDM.wms', // REQUIRED!
              params: {
                LAYERS: 'MapunitPoly',
                VERSION: '1.1.1',
              },
              visible: true, // defaults to true
              base: false // defaults to false
            };
            const wmsLayer = instance.addLayer('wms', wmsOpts);

            // Adding a ArcGIS MapServer tile layer.
            const arcGISTileOpts = {
              title: 'StateCityHighway_USA', // defaults to 'arcgis-tile'
              url: 'https://sampleserver1.arcgisonline.com/ArcGIS/rest/services/Specialty/ESRI_StateCityHighway_USA/MapServer', // REQUIRED!
              visible: true, // defaults to true
              base: false // defaults to false
            };
            const arcGISTileLayer = instance.addLayer('arcgis-tile', arcGISTileOpts);

            // Adding a COG tile layer.
            const cogTileOpts = {
              title: 'Sentinel COG', // defaults to 'geotiff'
              url: 'https://sentinel-cogs.s3.us-west-2.amazonaws.com/sentinel-s2-l2a-cogs/2020/S2A_36QWD_20200701_0_L2A/TCI.tif', // REQUIRED!
              visible: true, // defaults to true
              base: false // defaults to false
            };
            const cogTileLayer = instance.addLayer('geotiff', cogTileOpts);

            // TODO: This works, but clearly isn't a viable strategy
            cogTileLayer.once('change:source', () => instance.map.setView(cogTileLayer.getSource().getView()));

          },
        });
      }());

      // Display popup with coordinates when not clicking a feature.
      myMap.addPopup(function (event) {
        var feature = myMap.map.forEachFeatureAtPixel(event.pixel, function(feature, layer) { return feature; });
        if (!feature) {
          return '<div><h2>Coordinates</h2><p>' + event.coordinate + '</p></div>';
        }
      });
    </script>
  </body>
</html>
